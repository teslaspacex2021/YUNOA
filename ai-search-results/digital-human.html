<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天翼云数字人</title>
  <link rel="stylesheet" href="digital-human.css" />
  <link rel="stylesheet" href="../assets/third-panel.css" />
</head>
<body>
  <div class="app-layout">
    <!-- 左侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="user-avatar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#fff">
            <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
          </svg>
        </div>
        <span class="sidebar-title">天翼云数字人</span>
      </div>

      <a href="digital-human.html" class="new-chat-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        新对话
      </a>

      <nav class="sidebar-nav">
        <a href="digital-human.html?agent=enterprise-talent" class="nav-item">
          <span class="nav-icon">🏢</span> 惠企优才
        </a>
        <a href="digital-human.html?agent=enterprise-qa" class="nav-item">
          <span class="nav-icon">💬</span> 企业知识问答
        </a>
        <a href="digital-human.html?agent=value-mgmt" class="nav-item">
          <span class="nav-icon">📊</span> 价值经营
        </a>
        <a href="agent-plaza.html" class="nav-item">
          <span class="nav-icon">🤖</span> 智能体广场
        </a>
        <a href="#" class="nav-item">
          <span class="nav-icon">📅</span> 日程
        </a>
      </nav>

      <div class="sidebar-section">
        <div class="section-header">收起</div>
        <a href="#" class="nav-item sub">
          <span class="nav-icon">🛒</span> 技能商店
        </a>
        <a href="#" class="nav-item sub">
          <span class="nav-icon">🔧</span> MCP工具
        </a>
      </div>

      <div class="sidebar-section">
        <div class="section-header">知识中心</div>
        <a href="#" class="nav-item sub">知识运营</a>
      </div>

      <div class="sidebar-section recent">
        <div class="section-header">最近对话</div>
        <a href="#" class="recent-item">帮我查一下待办</a>
        <a href="#" class="recent-item">帮我总结下，输出 md 文件</a>
      </div>

      <a href="index.html" class="back-to-search">
        ← 返回公文搜索
      </a>
    </aside>

    <!-- 主内容区 -->
    <main class="chat-main">
      <div class="chat-welcome" id="chatWelcome">
        <h1 class="welcome-title">
          <span class="highlight">Hi</span> 我是天翼云数字人
        </h1>
        <p class="welcome-subtitle">请问有什么可以帮您的吗？</p>

        <div class="suggested-queries">
          <button class="query-pill">如何加快销售速度？</button>
          <button class="query-pill">如何修改 OA 密码？</button>
          <button class="query-pill">公文格式规范有哪些？</button>
          <button class="query-pill">AI 智慧办公大模型征集说明</button>
          <button class="query-refresh" title="换一换">🔄</button>
        </div>
      </div>

      <div class="chat-messages hidden" id="chatMessages"></div>

      <!-- 输入区 -->
      <div class="chat-input-area">
        <div class="input-box">
          <textarea
            id="chatInput"
            placeholder="请输入指令或问题和我对话吧"
            rows="3"
          ></textarea>
          <div class="input-toolbar">
            <div class="input-tools">
              <button class="tool-btn" title="附件">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                </svg>
              </button>
              <button class="tool-btn mode-btn active">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/><path d="M12 6v6l4 2"/>
                </svg>
                深度思考
              </button>
              <button class="tool-btn mode-btn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
                全网搜索
              </button>
            </div>
            <button class="send-btn" id="sendBtn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- 推荐智能体快捷入口 -->
        <div class="agent-shortcuts" id="agentShortcuts">
          <a href="#" class="agent-shortcut" data-agent="enterprise-talent">
            <span class="shortcut-icon">🏢</span>
            <span>惠企优才</span>
          </a>
          <a href="#" class="agent-shortcut" data-agent="enterprise-qa">
            <span class="shortcut-icon">💬</span>
            <span>企业知识问答</span>
          </a>
          <a href="#" class="agent-shortcut" data-agent="value-mgmt">
            <span class="shortcut-icon">📊</span>
            <span>价值经营</span>
          </a>
          <a href="#" class="agent-shortcut" data-agent="data-ops">
            <span class="shortcut-icon">📈</span>
            <span>数据运营智能体</span>
          </a>
          <a href="#" class="agent-shortcut" data-agent="office-writing">
            <span class="shortcut-icon">📝</span>
            <span>办公写作助手</span>
          </a>
          <a href="agent-plaza.html" class="agent-shortcut more">
            <span class="shortcut-icon">➕</span>
            <span>更多</span>
          </a>
        </div>
      </div>
    </main>

    <!-- 第三屏：检索记录 / 工作台 -->
    <aside class="third-panel hidden" id="dhThirdPanel"></aside>
  </div>

  <script src="../assets/public-files.js"></script>
  <script src="../assets/third-panel.js"></script>
  <script src="digital-human.js"></script>
</body>
</html>
